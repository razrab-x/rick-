<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Рик-Презентации™</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #eee; overscroll-behavior: none; }
  #menu { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: linear-gradient(180deg, #0a0a0a 0%, #141414 100%); }
  #menu.hide { display: none; }
  #menuHeader { padding: 18px 16px 10px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 10px; }
  #menuHeader h1 { flex: 1; font-size: 1.2rem; letter-spacing: 3px; color: #97ce4c; text-shadow: 0 0 10px rgba(151,206,76,0.4); }
  #menuHeader .icon-btn { background: #1f1f1f; border: 1px solid #333; color: #97ce4c; width: 38px; height: 38px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #menuHeader .icon-btn:active { background: #97ce4c; color: #0a0a0a; }
  #menuSub { padding: 8px 16px; font-size: 0.75rem; color: #666; letter-spacing: 1px; }
  #presList { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pres-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: all 0.15s; position: relative; }
  .pres-card:active { background: #1d1d1d; border-color: #97ce4c; transform: scale(0.99); }
  .pres-card .p-title { font-size: 1.05rem; color: #eee; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 80px; }
  .pres-card .p-meta { font-size: 0.72rem; color: #777; display: flex; gap: 12px; flex-wrap: wrap; }
  .pres-card .p-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .pres-card .p-actions button { background: #222; border: 1px solid #333; color: #aaa; width: 30px; height: 30px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pres-card .p-actions button:active { background: #97ce4c; color: #0a0a0a; }
  #menuFooter { padding: 12px 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; background: #0d0d0d; }
  #menuFooter button { flex: 1; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: #1f1f1f; border: 1px solid #333; color: #97ce4c; cursor: pointer; letter-spacing: 1px; }
  #menuFooter button:active { background: #97ce4c; color: #0a0a0a; }
  #menuFooter button.primary { background: #97ce4c; color: #0a0a0a; border-color: #97ce4c; font-weight: bold; }

  #editor { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  #editor.show { display: flex; }
  #topbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #141414; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  #topbar::-webkit-scrollbar { display: none; }
  #topbar .title { flex: 1; font-size: 0.8rem; color: #97ce4c; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 80px; }
  .icon-btn { background: #1f1f1f; border: 1px solid #333; color: #97ce4c; min-width: 36px; height: 36px; padding: 0 8px; border-radius: 8px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:active { background: #97ce4c; color: #0a0a0a; }
  #toolbar { display: none; gap: 6px; padding: 8px 10px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; align-items: center; }
  #toolbar::-webkit-scrollbar { display: none; }
  #toolbar.show { display: flex; }
  .tool { background: #222; border: 1px solid #333; color: #eee; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; }
  .tool:active { background: #97ce4c; color: #0a0a0a; }
  .tool.active { background: #97ce4c; color: #0a0a0a; }
  .tool.color-btn { position: relative; }
  .tool.color-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .divider { width: 1px; height: 24px; background: #333; flex-shrink: 0; margin: 0 2px; }
  #slideArea { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; background: #050505; }
  #canvas { width: 100%; height: 100%; background: #fff; color: #111; border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); touch-action: none; }
  #canvas.present { border-radius: 0; }

  @keyframes slideInRight { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideInLeft { from { transform: translateX(-80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #canvas.anim-right { animation: slideInRight 0.4s ease-out; }
  #canvas.anim-left { animation: slideInLeft 0.4s ease-out; }
  #canvas.anim-fade { animation: fadeIn 0.4s ease-out; }
  #canvas.anim-zoom { animation: zoomIn 0.4s ease-out; }

  .text-block { position: absolute; min-width: 40px; min-height: 30px; padding: 6px 8px; outline: none; cursor: move; white-space: pre-wrap; word-wrap: break-word; line-height: 1.3; border: 1px dashed transparent; }
  .text-block:focus { border-color: #4a90e2; cursor: text; }
  .text-block.selected { border: 1px dashed #97ce4c; }
  .text-block.present { cursor: default; border-color: transparent !important; }
  .img-block { position: absolute; border: 1px dashed transparent; cursor: move; user-select: none; touch-action: none; }
  .img-block img { display: block; width: 100%; height: 100%; pointer-events: none; object-fit: cover; }
  .img-block.selected { border-color: #97ce4c; }
  .img-block.present { border-color: transparent !important; cursor: default; }
  .handle { position: absolute; width: 20px; height: 20px; background: #97ce4c; border: 2px solid #0a0a0a; border-radius: 50%; z-index: 10; }
  .handle.tl { top: -10px; left: -10px; cursor: nwse-resize; }
  .handle.tr { top: -10px; right: -10px; cursor: nesw-resize; }
  .handle.bl { bottom: -10px; left: -10px; cursor: nesw-resize; }
  .handle.br { bottom: -10px; right: -10px; cursor: nwse-resize; }
  .handle.rot { bottom: -40px; left: 50%; transform: translateX(-50%); background: #f0c040; cursor: grab; }
  .present .handle { display: none; }
  #props { display: none; flex-direction: column; gap: 8px; padding: 10px 12px; background: #0f0f0f; border-top: 1px solid #2a2a2a; max-height: 40vh; overflow-y: auto; flex-shrink: 0; }
  #props.show { display: flex; }
  #props .row { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #props .row::-webkit-scrollbar { display: none; }
  #props .lbl { font-size: 0.7rem; color: #97ce4c; letter-spacing: 1px; min-width: 70px; text-transform: uppercase; flex-shrink: 0; }
  #props input[type="range"] { flex: 1; min-width: 100px; accent-color: #97ce4c; height: 4px; }
  #props input[type="color"] { width: 40px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 6px; }
  #props .mini { background: #222; border: 1px solid #333; color: #eee; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  #props .mini:active { background: #97ce4c; color: #0a0a0a; }
  #props .mini.active { background: #97ce4c; color: #0a0a0a; }
  #props .val { font-size: 0.75rem; color: #888; min-width: 40px; text-align: right; }
  #bottombar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; background: #141414; border-top: 1px solid #2a2a2a; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  #bottombar::-webkit-scrollbar { display: none; }
  #bottombar button { background: #1f1f1f; border: 1px solid #333; color: #97ce4c; padding: 9px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  #bottombar button:active { background: #97ce4c; color: #0a0a0a; }
  #bottombar button:disabled { opacity: 0.3; }
  #counter { font-size: 0.8rem; color: #888; letter-spacing: 1px; min-width: 50px; text-align: center; }
  #thumbs { display: none; gap: 8px; overflow-x: auto; padding: 8px 10px; background: #0f0f0f; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
  #thumbs.show { display: flex; }
  .thumb { min-width: 70px; height: 44px; background: #fff; color: #111; border-radius: 6px; padding: 4px; font-size: 0.5rem; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .thumb.active { border-color: #97ce4c; }
  .thumb .dup { position: absolute; top: 2px; right: 2px; background: #97ce4c; color: #0a0a0a; border: none; border-radius: 4px; font-size: 0.6rem; padding: 2px 4px; cursor: pointer; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  #modal.show { display: flex; }
  #modal .box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 18px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
  #modal h3 { color: #97ce4c; font-size: 1rem; letter-spacing: 1px; }
  #modal p { color: #aaa; font-size: 0.85rem; line-height: 1.4; }
  #modal .row { display: flex; gap: 10px; }
  #modal button { flex: 1; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 0.9rem; cursor: pointer; border: 1px solid #333; background: #222; color: #eee; }
  #modal button.primary { background: #97ce4c; color: #0a0a0a; border-color: #97ce4c; font-weight: bold; }
  #modal input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #eee; font-family: inherit; font-size: 1rem; width: 100%; }
  #modal .tpl-list { display: flex; flex-direction: column; gap: 8px; }
  #modal .tpl-item { background: #222; border: 1px solid #333; border-radius: 8px; padding: 12px; cursor: pointer; color: #eee; display: flex; gap: 10px; align-items: center; font-family: inherit; font-size: 0.9rem; text-align: left; }
  #modal .tpl-item:active { background: #97ce4c; color: #0a0a0a; }
  #modal .tpl-item .ico { font-size: 1.4rem; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #97ce4c; color: #0a0a0a; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 999; font-weight: bold; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #fab { position: fixed; right: 14px; bottom: 90px; width: 54px; height: 54px; border-radius: 50%; background: #97ce4c; color: #0a0a0a; border: none; font-size: 1.6rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 16px rgba(151,206,76,0.5); z-index: 500; display: flex; align-items: center; justify-content: center; }
  #fab:active { transform: scale(0.92); }
  #fab.hide { display: none; }
  body.present #fab, body.present #topbar, body.present #bottombar, body.present #toolbar, body.present #thumbs, body.present #props { display: none !important; }
  body.present #slideArea { padding: 0; background: #fff; }
</style>
</head>
<body>

<div id="menu">
  <div id="menuHeader">
    <h1>РИК-ПРЕЗЕНТАЦИИ™</h1>
    <button class="icon-btn" id="importBtn" title="Импорт">⬆</button>
    <button class="icon-btn" id="exportAllBtn" title="Экспорт JSON">⬇</button>
  </div>
  <div id="menuSub">Редактор презентаций</div>
  <div id="presList"></div>
  <div id="menuFooter">
    <button id="newPresBtn" class="primary">+ НОВАЯ ПРЕЗЕНТАЦИЯ</button>
  </div>
</div>

<div id="editor">
  <div id="topbar">
    <button class="icon-btn" id="backBtn">←</button>
    <div class="title" id="docTitle">Презентация</div>
    <button class="icon-btn" id="animBtn" title="Анимация переходов">🎞</button>
    <button class="icon-btn" id="exportPngBtn" title="Экспорт в PNG">📷</button>
    <button class="icon-btn" id="renameBtn">✎</button>
    <button class="icon-btn" id="textBtn">T</button>
    <button class="icon-btn" id="imgBtn">🖼</button>
    <button class="icon-btn" id="dupBtn">⧉</button>
    <button class="icon-btn" id="saveBtn">💾</button>
    <button class="icon-btn" id="presentBtn">▶</button>
  </div>

  <div id="toolbar">
    <button class="tool" data-cmd="bold"><b>B</b></button>
    <button class="tool" data-cmd="italic"><i>I</i></button>
    <button class="tool" data-cmd="underline"><u>U</u></button>
    <button class="tool" data-cmd="strikeThrough"><s>S</s></button>
    <div class="divider"></div>
    <button class="tool" data-cmd="justifyLeft">⬅</button>
    <button class="tool" data-cmd="justifyCenter">⬌</button>
    <button class="tool" data-cmd="justifyRight">➡</button>
    <div class="divider"></div>
    <button class="tool color-btn">🎨<input type="color" id="colorInput" value="#111111"></button>
  </div>

  <div id="slideArea"><div id="canvas"></div></div>
  <div id="props"></div>
  <div id="thumbs"></div>

  <div id="bottombar">
    <button id="prevBtn">◀</button>
    <button id="addBtn">+ СЛАЙД</button>
    <button id="dupSlideBtn">⧉</button>
    <div id="counter">1 / 1</div>
    <button id="delBtn">🗑</button>
    <button id="nextBtn">▶</button>
  </div>
</div>

<button id="fab" class="hide">+</button>
<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none;">
<input type="file" id="importInput" accept="application/json,.json" style="display:none;">

<div id="modal">
  <div class="box">
    <h3 id="modalTitle">Заголовок</h3>
    <p id="modalText"></p>
    <div id="modalContent"></div>
    <div class="row">
      <button id="modalCancel">Отмена</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'rick_presentations_v12';

  const menu = document.getElementById('menu');
  const editor = document.getElementById('editor');
  const presList = document.getElementById('presList');
  const fab = document.getElementById('fab');
  const canvas = document.getElementById('canvas');
  const toolbar = document.getElementById('toolbar');
  const props = document.getElementById('props');
  const counter = document.getElementById('counter');
  const docTitle = document.getElementById('docTitle');
  const thumbsEl = document.getElementById('thumbs');
  const toast = document.getElementById('toast');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalContent = document.getElementById('modalContent');
  const modalOk = document.getElementById('modalOk');
  const modalCancel = document.getElementById('modalCancel');
  const fileInput = document.getElementById('fileInput');
  const importInput = document.getElementById('importInput');
  const colorInput = document.getElementById('colorInput');

  let db = { presentations: {}, order: [] };
  let currentId = null;
  let selectedEl = null;
  let saveTimer = null;

  function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function uidEl(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function newSlide(){ return { bg: '#ffffff', elements: [] }; }
  function newPresentation(title){ return { id: uid(), title: title || 'Новая', slides: [newSlide()], updatedAt: Date.now(), animation: 'fade' }; }
  function cur(){ return currentId ? db.presentations[currentId] : null; }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
  }
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
    catch(e){ showToast('Память переполнена'); }
  }
  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.presentations) {
          db = p;
          if (!Array.isArray(db.order)) db.order = Object.keys(db.presentations);
          Object.values(db.presentations).forEach(pr => {
            if (!Array.isArray(pr.slides) || !pr.slides.length) pr.slides = [newSlide()];
            pr.slides.forEach(s => { if (!Array.isArray(s.elements)) s.elements = []; if (!s.bg) s.bg = '#ffffff'; });
            if (!pr.animation) pr.animation = 'fade';
          });
        }
      }
    } catch(e){}
  }
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  }

  function renderMenu(){
    presList.innerHTML = '';
    if (!db.order.length) {
      const e = document.createElement('div');
      e.style.cssText = 'text-align:center;padding:40px 20px;color:#555;font-size:0.9rem;line-height:1.6;';
      e.innerHTML = 'Пока пусто, Морти.<br>Жми «+ НОВАЯ ПРЕЗЕНТАЦИЯ».';
      presList.appendChild(e);
      return;
    }
    db.order.forEach(id => {
      const pr = db.presentations[id]; if (!pr) return;
      const card = document.createElement('div'); card.className = 'pres-card';
      const t = document.createElement('div'); t.className = 'p-title'; t.textContent = pr.title;
      card.appendChild(t);
      const meta = document.createElement('div'); meta.className = 'p-meta';
      meta.innerHTML = `<span>📊 ${pr.slides.length} слайдов</span><span>🕒 ${fmtDate(pr.updatedAt||Date.now())}</span>`;
      card.appendChild(meta);
      const acts = document.createElement('div'); acts.className = 'p-actions';
      const dupB = document.createElement('button'); dupB.textContent='⧉';
      dupB.onclick = e => { e.stopPropagation(); duplicatePres(id); };
      acts.appendChild(dupB);
      const delB = document.createElement('button'); delB.textContent='🗑';
      delB.onclick = e => { e.stopPropagation(); deletePres(id); };
      acts.appendChild(delB);
      card.appendChild(acts);
      card.onclick = () => openPres(id);
      presList.appendChild(card);
    });
  }

  function createEmptyPres(){
    openPrompt('Новая презентация', 'Название:', 'Презентация ' + (db.order.length+1), v => {
      const pr = newPresentation(v);
      db.presentations[pr.id] = pr; db.order.unshift(pr.id); save(); openPres(pr.id);
    });
  }
  function duplicatePres(id){
    const pr = db.presentations[id]; if (!pr) return;
    const c = JSON.parse(JSON.stringify(pr));
    c.id = uid(); c.title = pr.title + ' (копия)'; c.updatedAt = Date.now();
    db.presentations[c.id] = c; db.order.unshift(c.id);
    save(); renderMenu(); showToast('Скопировано');
  }
  function deletePres(id){
    const pr = db.presentations[id]; if (!pr) return;
    openConfirm('Удалить?', `«${pr.title}»`, () => {
      delete db.presentations[id];
      db.order = db.order.filter(x => x !== id);
      save(); renderMenu(); showToast('Удалено');
    });
  }
  function openPres(id){
    currentId = id;
    menu.classList.add('hide'); editor.classList.add('show'); fab.classList.remove('hide');
    render();
  }
  function backToMenu(){
    save(); currentId = null;
    editor.classList.remove('show'); menu.classList.remove('hide'); fab.classList.add('hide');
    renderMenu();
  }

  function render(){
    if (!currentId) return;
    const pr = cur(); if (!pr) { backToMenu(); return; }
    docTitle.textContent = pr.title;
    if (typeof pr.current !== 'number' || pr.current < 0 || pr.current >= pr.slides.length) pr.current = 0;
    counter.textContent = (pr.current+1) + ' / ' + pr.slides.length;
    document.getElementById('prevBtn').disabled = pr.current === 0;
    document.getElementById('nextBtn').disabled = pr.current === pr.slides.length - 1;
    renderCanvas(); renderThumbs();
  }

  function switchSlide(newIndex, direction){
    const pr = cur(); if (!pr) return;
    if (newIndex < 0 || newIndex >= pr.slides.length) return;
    if (newIndex === pr.current) return;
    const dir = direction || (newIndex > pr.current ? 'right' : 'left');
    pr.current = newIndex;
    render();
    const anim = pr.animation || 'fade';
    if (anim === 'none') return;
    const cls = 'anim-' + (anim === 'slide' ? dir : anim);
    canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom');
    void canvas.offsetWidth;
    canvas.classList.add(cls);
    setTimeout(() => canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom'), 450);
  }

  function renderCanvas(){
    canvas.innerHTML = '';
    const pr = cur();
    const slide = pr.slides[pr.current];
    canvas.style.background = slide.bg || '#ffffff';
    slide.elements.forEach(el => canvas.appendChild(createElNode(el)));
    selectedEl = null;
    toolbar.classList.remove('show'); props.classList.remove('show');
  }

  function renderThumbs(){
    const pr = cur();
    thumbsEl.innerHTML = '';
    pr.slides.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'thumb' + (i === pr.current ? ' active' : '');
      const t = s.elements.find(e => e.type === 'text');
      d.textContent = t ? t.text.slice(0, 25) : (s.elements.length ? '🖼' : '—');

  function createElNode(el){
    const node = document.createElement('div');
    node.className = el.type === 'text' ? 'text-block' : 'img-block';
    node.dataset.id = el.id;
    applyStyles(node, el);
    if (el.type === 'text') {
      node.contentEditable = document.body.classList.contains('present') ? 'false' : 'true';
      node.innerHTML = el.html || '';
    } else {
      const img = document.createElement('img');
      img.src = el.src; img.draggable = false;
      node.appendChild(img);
    }
    makeDraggable(node, el);
    return node;
  }

  function applyStyles(node, el){
    node.style.left = el.x + 'px';
    node.style.top = el.y + 'px';
    node.style.width = el.w + 'px';
    node.style.height = el.h + 'px';
    let tr = [];
    if (el.rot) tr.push(`rotate(${el.rot}deg)`);
    if (el.flipX) tr.push('scaleX(-1)');
    if (el.flipY) tr.push('scaleY(-1)');
    node.style.transform = tr.join(' ');
    node.style.opacity = el.opacity != null ? el.opacity : 1;
    if (el.type === 'text') {
      node.style.fontFamily = el.fontFamily || 'inherit';
      node.style.fontSize = (el.fontSize || 20) + 'px';
      node.style.color = el.color || '#111';
      node.style.background = el.bg || 'transparent';
      node.style.textAlign = el.align || 'left';
      node.style.fontWeight = el.bold ? 'bold' : 'normal';
      node.style.fontStyle = el.italic ? 'italic' : 'normal';
      node.style.textDecoration = el.underline ? 'underline' : (el.strike ? 'line-through' : 'none');
      node.style.lineHeight = el.lineHeight || 1.3;
      node.style.letterSpacing = (el.letterSpacing || 0) + 'px';
      node.style.borderRadius = (el.radius || 0) + 'px';
      node.style.padding = (el.padding != null ? el.padding : 6) + 'px ' + (el.paddingX != null ? el.paddingX : 8) + 'px';
      if (el.shadow) node.style.textShadow = `${el.shadowX||2}px ${el.shadowY||2}px ${el.shadowBlur||4}px ${el.shadowColor||'#000000'}`;
      else node.style.textShadow = 'none';
      if (el.stroke) node.style.webkitTextStroke = `${el.strokeWidth||1}px ${el.strokeColor||'#000000'}`;
      else node.style.webkitTextStroke = '';
    } else {
      node.style.borderRadius = (el.radius || 0) + 'px';
      if (el.shadow) node.style.boxShadow = `${el.shadowX||4}px ${el.shadowY||4}px ${el.shadowBlur||10}px ${el.shadowColor||'#00000066'}`;
      else node.style.boxShadow = 'none';
      if (el.border) node.style.border = `${el.borderWidth||2}px solid ${el.borderColor||'#000000'}`;
      else node.style.border = '1px dashed transparent';
      node.style.overflow = 'hidden';
    }
  }

  function makeDraggable(node, el){
    let sx, sy, sl, st, sw, sh, mode = null, pd = 0, pw = 0, ph = 0;
    function gp(e){ if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY }; return { x: e.clientX, y: e.clientY }; }
    function gd(t1,t2){ const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY; return Math.sqrt(dx*dx+dy*dy); }
    function onStart(e){
      if (document.body.classList.contains('present')) return;
      selectEl(node, el);
      if (e.touches && e.touches.length === 2) {
        mode = 'pinch';
        pd = gd(e.touches[0], e.touches[1]);
        pw = parseFloat(node.style.width) || node.offsetWidth;
        ph = parseFloat(node.style.height) || node.offsetHeight;
        e.preventDefault(); return;
      }
      mode = e.target.classList.contains('handle') ? (e.target.dataset.mode || 'move') : 'move';
      const p = gp(e);
      sx = p.x; sy = p.y;
      sl = parseFloat(node.style.left) || 0;
      st = parseFloat(node.style.top) || 0;
      sw = parseFloat(node.style.width) || node.offsetWidth;
      sh = parseFloat(node.style.height) || node.offsetHeight;
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
      e.preventDefault(); e.stopPropagation();
    }
    function onMove(e){
      if (!mode) return;
      if (mode === 'pinch') {
        if (!e.touches || e.touches.length < 2) return;
        const r = gd(e.touches[0], e.touches[1]) / pd;
        const nw = Math.max(30, pw * r), nh = Math.max(20, ph * r);
        node.style.width = nw + 'px'; node.style.height = nh + 'px';
        el.w = nw; el.h = nh;
        e.preventDefault(); scheduleSave(); return;
      }
      const p = gp(e);
      const dx = p.x - sx, dy = p.y - sy;
      const scale = canvas.getBoundingClientRect().width / canvas.offsetWidth || 1;
      if (mode === 'move') {
        let nx = sl + dx/scale, ny = st + dy/scale;
        node.style.left = nx + 'px'; node.style.top = ny + 'px';
        el.x = nx; el.y = ny;
      } else if (mode === 'resize-br') {
        let nw = Math.max(30, sw + dx/scale), nh = Math.max(20, sh + dy/scale);
        if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
        node.style.width = nw + 'px'; node.style.height = nh + 'px';
        el.w = nw; el.h = nh;
      } else if (mode === 'resize-tl') {
        let nw = Math.max(30, sw - dx/scale), nh = Math.max(20, sh - dy/scale);
        if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
        let nx = sl + (sw - nw), ny = st + (sh - nh);
        node.style.width = nw + 'px'; node.style.height = nh + 'px';
        node.style.left = nx + 'px'; node.style.top = ny + 'px';
        el.w = nw; el.h = nh; el.x = nx; el.y = ny;
      } else if (mode === 'resize-tr') {
        let nw = Math.max(30, sw + dx/scale), nh = Math.max(20, sh - dy/scale);
        if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
        let ny = st + (sh - nh);
        node.style.width = nw + 'px'; node.style.height = nh + 'px'; node.style.top = ny + 'px';
        el.w = nw; el.h = nh; el.y = ny;
      } else if (mode === 'resize-bl') {
        let nw = Math.max(30, sw - dx/scale), nh = Math.max(20, sh + dy/scale);
        if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
        let nx = sl + (sw - nw);
        node.style.width = nw + 'px'; node.style.height = nh + 'px'; node.style.left = nx + 'px';
        el.w = nw; el.h = nh; el.x = nx;
      } else if (mode === 'rotate') {
        const rect = node.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        let ang = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90;
        el.rot = ang;
        let tr = [`rotate(${ang}deg)`];
        if (el.flipX) tr.push('scaleX(-1)');
        if (el.flipY) tr.push('scaleY(-1)');
        node.style.transform = tr.join(' ');
      }
      scheduleSave(); e.preventDefault();
    }
    function onEnd(){
      if (mode === 'pinch') { mode = null; return; }
      if (!mode) return;
      mode = null;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      save();
    }
    node.addEventListener('mousedown', onStart);
    node.addEventListener('touchstart', onStart, { passive: false });
  }

  function selectEl(node, el){

  function mkRange(min, max, value, onInput){

  function scaleEl(f){
    if (!selectedEl) return;
    const el = selectedEl.el;
    const nw = Math.max(20, (el.w||100)*f), nh = Math.max(20, (el.h||100)*f);
    el.w = nw; el.h = nh;
    selectedEl.node.style.width = nw + 'px'; selectedEl.node.style.height = nh + 'px';
    scheduleSave();
  }
  function duplicateSelected(){
    if (!selectedEl) return;
    const el = JSON.parse(JSON.stringify(selectedEl.el));
    el.id = uidEl(); el.x = (el.x||0)+20; el.y = (el.y||0)+20;
    cur().slides[cur().current].elements.push(el);
    const node = createElNode(el); canvas.appendChild(node);
    setTimeout(() => selectEl(node, el), 50);
    scheduleSave();
  }
  function deleteSelected(){
    if (!selectedEl) return;
    const el = selectedEl.el;
    const pr = cur();
    pr.slides[pr.current].elements = pr.slides[pr.current].elements.filter(x => x.id !== el.id);
    selectedEl.node.remove(); clearSelection(); scheduleSave();
  }

  function addSlideWithTemplate(){
    const templates = [
      { name: 'Пустой', ico: '▢', build: () => [newSlide()] },
      { name: 'Титульный', ico: '🎬', build: () => {
        const s = newSlide();
        s.elements.push(txt('Заголовок', 20, 80, 260, 80, {fontSize: 34, align: 'center', bold: true}));
        s.elements.push(txt('Подзаголовок', 40, 180, 220, 40, {fontSize: 18, align: 'center', italic: true, color: '#666666'}));
        return [s];
      }},
      { name: 'Тёмный', ico: '🌑', build: () => {
        const s = newSlide(); s.bg = '#111111';
        s.elements.push(txt('ТЕКСТ', 15, 120, 270, 120, {fontSize: 56, align: 'center', fontFamily: 'Impact', color: '#97ce4c', letterSpacing: 2}));
        return [s];
      }},
      { name: 'Две колонки', ico: '⬌', build: () => {
        const s = newSlide();
        s.elements.push(txt('Заголовок', 15, 40, 130, 40, {fontSize: 22, bold: true, underline: true}));
        s.elements.push(txt('Левая колонка', 15, 100, 130, 160, {fontSize: 15, lineHeight: 1.5}));
        s.elements.push(txt('Правая колонка', 155, 100, 130, 160, {fontSize: 15, lineHeight: 1.5}));
        return [s];
      }},
    ];
    modalTitle.textContent = 'Новый слайд';
    modalText.textContent = 'Выбери шаблон:';
    modalContent.innerHTML = '';
    const list = document.createElement('div'); list.className = 'tpl-list';
    templates.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tpl-item';
      b.innerHTML = `<span class="ico">${t.ico}</span><span>${t.name}</span>`;
      b.onclick = () => {
        closeModal();
        const pr = cur();
        const sl = t.build();
        pr.slides.splice(pr.current + 1, 0, ...sl);
        switchSlide(pr.current + sl.length);
        scheduleSave(); showToast('Слайд добавлен');
      };
      list.appendChild(b);
    });
    modalContent.appendChild(list);
    modalOk.style.display = 'none';
    modalCancel.textContent = 'Закрыть';
    modalCancel.onclick = closeModal;
    modal.classList.add('show');
  }

  function txt(text, x, y, w, h, opts){
    return Object.assign({
      id: uidEl(), type: 'text', x, y, w, h,
      html: text, text: text,
      fontSize: 22, color: '#111111', bg: 'transparent',
      fontFamily: 'inherit', align: 'left', bold: false, italic: false,
      underline: false, strike: false, lineHeight: 1.3, letterSpacing: 0,
      radius: 0, padding: 6, paddingX: 8, opacity: 1, rot: 0,
      shadow: false, stroke: false
    }, opts || {});
  }

  // ===== ЭКСПОРТ В PNG =====
  function downloadPng(dataUrl, name){
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  async function renderSlideToPng(slideIndex){
    const pr = cur();
    if (!pr) throw new Error('Нет презентации');
    const slide = pr.slides[slideIndex];
    const w = canvas.offsetWidth || 640;
    const h = canvas.offsetHeight || 360;

    const clone = document.createElement('div');
    clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    clone.style.cssText = `width:${w}px;height:${h}px;background:${slide.bg || '#ffffff'};position:relative;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;`;

    slide.elements.forEach(el => {
      const node = createElNode(el);
      node.contentEditable = 'false';
      node.style.cursor = 'default';
      node.classList.remove('selected');
      const hs = node.querySelectorAll && node.querySelectorAll('.handle');
      if (hs) hs.forEach(hh => hh.remove());
      clone.appendChild(node);
    });

    const xml = new XMLSerializer().serializeToString(clone);
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;

    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    try {
      const img = await new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error('Не удалось отрендерить слайд'));
        im.src = url;
      });

      const c = document.createElement('canvas');
      const scale = 2;
      c.width = w * scale;
      c.height = h * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = slide.bg || '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function openExportDialog(){
    const pr = cur(); if (!pr) return;
    modalTitle.textContent = 'Экспорт слайдов';
    modalText.textContent = 'Сохранить как PNG-картинки:';
    modalContent.innerHTML = '';
    const list = document.createElement('div'); list.className = 'tpl-list';

    const b1 = document.createElement('button');
    b1.className = 'tpl-item';
    b1.innerHTML = `<span class="ico">📄</span><span>Текущий слайд (${pr.current+1})</span>`;
    b1.onclick = async () => {
      closeModal();
      showToast('Готовлю картинку...');
      try {
        const dataUrl = await renderSlideToPng(pr.current);
        downloadPng(dataUrl, 'slide-' + (pr.current+1) + '.png');
        showToast('Сохранено!');
      } catch(e) {
        console.error(e);
        showToast('Ошибка: ' + e.message);
      }
    };
    list.appendChild(b1);

    const b2 = document.createElement('button');
    b2.className = 'tpl-item';
    b2.innerHTML = `<span class="ico">📚</span><span>Все слайды (${pr.slides.length} PNG)</span>`;
    b2.onclick = async () => {
      closeModal();
      showToast('Готовлю ' + pr.slides.length + ' картинок...');
      let ok = 0, fail = 0;
      for (let i = 0; i < pr.slides.length; i++) {
        try {
          const dataUrl = await renderSlideToPng(i);
          downloadPng(dataUrl, 'slide-' + (i+1) + '.png');
          ok++;
        } catch(e) {
          console.error('Slide ' + i, e);
          fail++;
        }
        await new Promise(r => setTimeout(r, 500));
      }
      showToast('Готово: ' + ok + ' ok' + (fail ? ', ' + fail + ' fail' : ''));
    };
    list.appendChild(b2);

    modalContent.appendChild(list);
    modalOk.style.display = 'none';
    modalCancel.textContent = 'Закрыть';
    modalCancel.onclick = closeModal;
    modal.classList.add('show');
  }

  function openAnimDialog(){
    const pr = cur(); if (!pr) return;
    const curAnim = pr.animation || 'fade';
    modalTitle.textContent = 'Анимация переходов';
    modalText.textContent = 'Как переключать слайды:';
    modalContent.innerHTML = '';
    const list = document.createElement('div'); list.className = 'tpl-list';
    const opts = [
      ['none', '🚫', 'Нет'],
      ['fade', '✨', 'Плавное появление'],
      ['slide', '➡', 'Сдвиг в сторону'],
      ['zoom', '🔍', 'Приближение']
    ];
    opts.forEach(([val, ico, name]) => {
      const b = document.createElement('button');
      b.className = 'tpl-item';
      if (curAnim === val) { b.style.background = '#97ce4c'; b.style.color = '#0a0a0a'; }
      b.innerHTML = `<span class="ico">${ico}</span><span>${name}</span>`;
      b.onclick = () => {
        pr.animation = val;
        save(); closeModal();
        showToast('Анимация: ' + name);
        if (val !== 'none') {
          canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom');
          void canvas.offsetWidth;
          canvas.classList.add('anim-' + (val === 'slide' ? 'right' : val));
          setTimeout(() => canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom'), 500);
        }
      };
      list.appendChild(b);
    });
    modalContent.appendChild(list);
    modalOk.style.display = 'none';
    modalCancel.textContent = 'Закрыть';
    modalCancel.onclick = closeModal;
    modal.classList.add('show');
  }

  document.getElementById('backBtn').addEventListener('click', backToMenu);
  document.getElementById('textBtn').addEventListener('click', () => addText());
  document.getElementById('imgBtn').addEventListener('click', pickImage);
  document.getElementById('fab').addEventListener('click', () => addText());
  document.getElementById('dupBtn').addEventListener('click', duplicateSelected);
  document.getElementById('newPresBtn').addEventListener('click', createEmptyPres);
  document.getElementById('animBtn').addEventListener('click', openAnimDialog);
  document.getElementById('exportPngBtn').addEventListener('click', openExportDialog);
  document.getElementById('renameBtn').addEventListener('click', () => {
    const pr = cur(); if (!pr) return;
    openPrompt('Название', '', pr.title, v => { pr.title = v; pr.updatedAt = Date.now(); docTitle.textContent = v; save(); });
  });
  document.getElementById('saveBtn').addEventListener('click', () => { save(); showToast('Сохранено'); });
  document.getElementById('addBtn').addEventListener('click', addSlideWithTemplate);
  document.getElementById('dupSlideBtn').addEventListener('click', () => duplicateSlide(cur().current));
  document.getElementById('delBtn').addEventListener('click', () => {
    const pr = cur();
    if (pr.slides.length <= 1) { pr.slides[0] = newSlide(); pr.current = 0; render(); save(); return; }
    openConfirm('Удалить слайд?', '', () => {
      pr.slides.splice(pr.current, 1);
      if (pr.current >= pr.slides.length) pr.current = pr.slides.length - 1;
      render(); save(); showToast('Удалён');
    });
  });
  document.getElementById('prevBtn').addEventListener('click', () => { const pr = cur(); if (pr.current > 0) switchSlide(pr.current - 1, 'left'); save(); });
  document.getElementById('nextBtn').addEventListener('click', () => { const pr = cur(); if (pr.current < pr.slides.length - 1) switchSlide(pr.current + 1, 'right'); save(); });

  const thumbsBtn = document.createElement('button');
  thumbsBtn.className = 'icon-btn'; thumbsBtn.textContent = '☰'; thumbsBtn.title = 'Слайды';
  thumbsBtn.onclick = () => thumbsEl.classList.toggle('show');
  document.getElementById('topbar').insertBefore(thumbsBtn, document.getElementById('renameBtn'));

  document.getElementById('presentBtn').addEventListener('click', () => {
    clearSelection();
    document.body.classList.add('present');
    canvas.classList.add('present');
    document.querySelectorAll('.text-block').forEach(n => n.contentEditable = 'false');
    if (canvas.requestFullscreen) canvas.requestFullscreen().catch(()=>{});
    else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
    showToast('Свайп влево/вправо');
  });
  function exitPresent(){
    if (!document.body.classList.contains('present')) return;
    document.body.classList.remove('present');
    canvas.classList.remove('present');
    document.querySelectorAll('.text-block').forEach(n => n.contentEditable = 'true');
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    if (document.webkitFullscreenElement) document.webkitExitFullscreen();
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) exitPresent(); });
  document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement) exitPresent(); });

  let tX=0, tY=0, tT=0;
  document.getElementById('slideArea').addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.changedTouches[0]; tX = t.clientX; tY = t.clientY; tT = Date.now();
  }, { passive: true });
  document.getElementById('slideArea').addEventListener('touchend', e => {
    if (!document.body.classList.contains('present')) return;
    const pr = cur(); if (!pr) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tX, dy = t.clientY - tY, dt = Date.now() - tT;
    if (dt < 700 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && pr.current < pr.slides.length - 1) { switchSlide(pr.current + 1, 'right'); save(); }
      else if (dx > 0 && pr.current > 0) { switchSlide(pr.current - 1, 'left'); save(); }
    }
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (!currentId) return;
    const inText = e.target.classList && e.target.classList.contains('text-block') && e.target.isContentEditable;
    if (inText) return;
    const pr = cur(); if (!pr) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (pr.current < pr.slides.length - 1) { switchSlide(pr.current + 1, 'right'); save(); } }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (pr.current > 0) { switchSlide(pr.current - 1, 'left'); save(); } }
    else if (e.key === 'Escape') exitPresent();
    else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedEl) deleteSelected();
    else if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateSelected(); }
  });

  function exportAll(){
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const s = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url; a.download = 'rick-presentations-' + s + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    showToast('Файл скачан');
  }
  function importData(){ importInput.value = ''; importInput.click(); }
  importInput.addEventListener('change', () => {
    const f = importInput.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || !data.presentations) throw 0;
        openConfirm('Импорт', 'Добавить к текущим?', () => {
          Object.values(data.presentations).forEach(pr => {
            if (!pr.id) pr.id = uid();
            let nid = pr.id;
            while (db.presentations[nid]) nid = uid();
            pr.id = nid;
            db.presentations[nid] = pr;
            db.order.unshift(nid);
          });
          save(); renderMenu(); showToast('Импортировано');
        });
      } catch(e) { showToast('Файл битый'); }
    };
    rd.readAsText(f);
  });
  document.getElementById('exportAllBtn').addEventListener('click', exportAll);
  document.getElementById('importBtn').addEventListener('click', importData);

  function openPrompt(title, text, defaultValue, onOk){
    modalTitle.textContent = title;
    modalText.textContent = text || '';
    modalContent.innerHTML = '';
    const i = document.createElement('input'); i.type = 'text'; i.value = defaultValue;
    modalContent.appendChild(i);
    modalOk.style.display = ''; modalOk.className = 'primary';
    modalOk.textContent = 'OK'; modalCancel.textContent = 'Отмена'; modalCancel.style.display = '';
    modal.classList.add('show');
    setTimeout(() => { i.focus(); i.select(); }, 50);
    modalOk.onclick = () => { const v = i.value.trim(); if (v) { closeModal(); onOk(v); } };
    modalCancel.onclick = closeModal;
    i.onkeydown = ev => { if (ev.key === 'Enter') modalOk.click(); };
  }
  function openConfirm(title, text, onOk){
    modalTitle.textContent = title;
    modalText.textContent = text || '';
    modalContent.innerHTML = '';
    modalOk.style.display = ''; modalOk.className = 'primary';
    modalOk.textContent = 'Да'; modalCancel.textContent = 'Отмена'; modalCancel.style.display = '';
    modal.classList.add('show');
    modalOk.onclick = () => { closeModal(); onOk && onOk(); };
    modalCancel.onclick = closeModal;
  }
  function closeModal(){ modal.classList.remove('show'); }

  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  load();
  renderMenu();
})();
</script>
</body>
