<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Рик-Презентации™</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #eee; overscroll-behavior: none; }

  :root {
    --ios-ease: cubic-bezier(0.32, 0.72, 0, 1);
    --green: #97ce4c;
    --green-glow: rgba(151,206,76,0.5);
    --purple: #6a4cce;
  }

  /* iOS-like spring animations */
  @keyframes ios-slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes ios-slide-down { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes ios-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ios-scale { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes ios-pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

  /* ==== AUTH ==== */
  #authScreen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 20px 24px; justify-content: center; background: radial-gradient(ellipse at top, #1a2a0a 0%, #0a0a0a 60%); overflow-y: auto; animation: ios-fade 0.5s var(--ios-ease); }
  .rick-hero { width: 120px; height: 120px; object-fit: contain; display: block; margin: 0 auto 10px; filter: drop-shadow(0 0 25px var(--green-glow)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #authScreen h1 { color: var(--green); font-size: 1.5rem; letter-spacing: 3px; text-align: center; margin-bottom: 8px; text-shadow: 0 0 15px var(--green-glow); }
  #authScreen .quote { text-align: center; color: var(--green); font-size: 0.78rem; font-style: italic; margin-bottom: 20px; min-height: 2.6em; padding: 0 12px; transition: opacity 0.4s; }
  #authScreen .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #1a1a1a; border-radius: 10px; padding: 4px; }
  #authScreen .tabs button { flex: 1; padding: 10px; background: transparent; color: #888; border: none; border-radius: 8px; font-family: inherit; font-size: 0.9rem; cursor: pointer; letter-spacing: 1px; transition: all 0.3s var(--ios-ease); }
  #authScreen .tabs button.active { background: var(--green); color: #0a0a0a; font-weight: bold; }
  #authScreen input { width: 100%; padding: 14px; margin-bottom: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; color: #eee; font-family: inherit; font-size: 1rem; transition: all 0.2s; }
  #authScreen input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(151,206,76,0.15); }
  #authScreen .submit { width: 100%; padding: 14px; background: var(--green); color: #0a0a0a; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; letter-spacing: 1px; margin-top: 6px; transition: transform 0.15s var(--ios-ease); }
  #authScreen .submit:active { transform: scale(0.96); background: #7aab3a; }
  #authScreen .error { color: #ff6b6b; font-size: 0.85rem; text-align: center; margin-top: 12px; min-height: 1.2em; }
  #authScreen .hint { color: #666; font-size: 0.72rem; text-align: center; margin-top: 20px; line-height: 1.5; }

  /* ==== MENU ==== */
  #menu { display: none; flex-direction: column; height: 100vh; height: 100dvh; background: linear-gradient(180deg, #0a0a0a 0%, #141414 100%); }
  #menu.show { display: flex; animation: ios-fade 0.4s var(--ios-ease); }
  #menuHeader { padding: 14px 16px 8px; display: flex; align-items: center; gap: 10px; }
  #menuHeader .avatar-wrap { position: relative; width: 42px; height: 42px; flex-shrink: 0; cursor: pointer; }
  #menuHeader .avatar-img { width: 42px; height: 42px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0a0a0a; font-size: 1.1rem; overflow: hidden; transition: transform 0.2s var(--ios-ease); }
  #menuHeader .avatar-wrap:active .avatar-img { transform: scale(0.9); }
  #menuHeader .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
  #menuHeader .user { font-size: 0.75rem; color: #888; }
  #menuHeader .icon-btn { background: #1f1f1f; border: 1px solid #333; color: var(--green); width: 36px; height: 36px; border-radius: 10px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s var(--ios-ease); }
  #menuHeader .icon-btn:active { background: var(--green); color: #0a0a0a; transform: scale(0.9); }
  #tabs { display: flex; padding: 8px 12px; gap: 4px; border-bottom: 1px solid #1a1a1a; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 1; min-width: 70px; padding: 10px 8px; background: transparent; border: none; color: #888; font-family: inherit; font-size: 0.75rem; letter-spacing: 0.5px; cursor: pointer; border-radius: 8px; transition: all 0.2s var(--ios-ease); position: relative; }
  #tabs button.active { color: var(--green); background: rgba(151,206,76,0.1); }
  #tabs button .badge { position: absolute; top: 4px; right: 4px; background: #ff4444; color: #fff; font-size: 0.6rem; padding: 1px 5px; border-radius: 8px; min-width: 14px; }
  #content { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
  .empty { text-align: center; padding: 30px 20px; color: #555; font-size: 0.9rem; line-height: 1.6; animation: ios-fade 0.4s var(--ios-ease); }
  .empty .morty-empty { width: 100px; height: 100px; object-fit: contain; opacity: 0.85; display: block; margin: 0 auto 14px; filter: drop-shadow(0 0 12px var(--green-glow)); }

  /* ==== CARDS ==== */
  .pres-card { background: rgba(22,22,22,0.8); backdrop-filter: blur(10px); border: 1px solid #2a2a2a; border-radius: 14px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: all 0.25s var(--ios-ease); position: relative; margin-bottom: 10px; animation: ios-slide-down 0.35s var(--ios-ease) backwards; }
  .pres-card:active { background: #1d1d1d; border-color: var(--green); transform: scale(0.98); }
  .pres-card .p-title { font-size: 1rem; color: #eee; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 80px; }
  .pres-card .p-meta { font-size: 0.72rem; color: #777; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .pres-card .p-thumb { width: 40px; height: 40px; border-radius: 8px; background: #222; display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; overflow: hidden; }
  .pres-card .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pres-card .p-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .pres-card .p-actions button { background: #222; border: 1px solid #333; color: #aaa; width: 30px; height: 30px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s var(--ios-ease); }
  .pres-card .p-actions button:active { background: var(--green); color: #0a0a0a; transform: scale(0.9); }

  /* ==== NEWS ==== */
  .news-card { background: rgba(22,22,22,0.8); backdrop-filter: blur(10px); border: 1px solid #2a2a2a; border-radius: 14px; padding: 14px; margin-bottom: 10px; animation: ios-slide-down 0.35s var(--ios-ease) backwards; }
  .news-card h3 { color: var(--green); font-size: 1rem; margin-bottom: 6px; }
  .news-card .meta { font-size: 0.7rem; color: #666; margin-bottom: 8px; }
  .news-card .body { font-size: 0.9rem; line-height: 1.5; color: #ccc; white-space: pre-wrap; }
  .news-card .news-img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; display: block; }
  .news-card .del { background: #551a1a; border: 1px solid #aa3333; color: #ff9999; padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; margin-top: 8px; }

  /* ==== USERS ==== */
  .user-card { background: rgba(22,22,22,0.8); backdrop-filter: blur(10px); border: 1px solid #2a2a2a; border-radius: 14px; padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; transition: all 0.2s var(--ios-ease); animation: ios-slide-down 0.35s var(--ios-ease) backwards; }
  .user-card:active { background: #1d1d1d; border-color: var(--green); transform: scale(0.98); }
  .user-card .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--green); color: #0a0a0a; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; overflow: hidden; flex-shrink: 0; }
  .user-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-card .info { flex: 1; min-width: 0; }
  .user-card .name { font-size: 1rem; color: #eee; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .email { font-size: 0.72rem; color: #777; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ==== REQUESTS ==== */
  .req-card { background: rgba(106,76,206,0.15); border: 1px solid var(--purple); border-radius: 14px; padding: 14px; margin-bottom: 10px; animation: ios-slide-down 0.35s var(--ios-ease) backwards; }
  .req-card .req-title { font-size: 0.95rem; color: #eee; margin-bottom: 8px; }
  .req-card .req-btns { display: flex; gap: 8px; margin-top: 10px; }
  .req-card .req-btns button { flex: 1; padding: 10px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer; border: 1px solid #333; background: #222; color: #eee; transition: all 0.15s var(--ios-ease); }
  .req-card .req-btns button:active { transform: scale(0.95); }
  .req-card .req-btns .accept { background: var(--green); color: #0a0a0a; border-color: var(--green); font-weight: bold; }
  .req-card .req-btns .decline { background: #551a1a; color: #ff9999; border-color: #aa3333; }

  /* ==== CHAT ==== */
  #chatBox { display: flex; flex-direction: column; height: 100%; }
  #chatMessages { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { display: flex; gap: 8px; align-items: flex-start; animation: ios-slide-up 0.3s var(--ios-ease); }
  .chat-msg.me { flex-direction: row-reverse; }
  .chat-msg .c-av { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #0a0a0a; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; overflow: hidden; }
  .chat-msg .c-av img { width: 100%; height: 100%; object-fit: cover; }
  .chat-msg .c-bubble { max-width: 70%; padding: 10px 14px; background: #1f1f1f; border-radius: 18px; border-top-left-radius: 4px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
  .chat-msg.me .c-bubble { background: var(--green); color: #0a0a0a; border-top-left-radius: 18px; border-top-right-radius: 4px; }
  .chat-msg .c-name { font-size: 0.65rem; color: #666; margin-bottom: 2px; }
  .chat-msg.me .c-name { text-align: right; }
  #chatInputWrap { display: flex; gap: 8px; padding: 8px 4px 4px; border-top: 1px solid #1a1a1a; }
  #chatInput { flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 22px; color: #eee; font-family: inherit; font-size: 0.95rem; }
  #chatInput:focus { outline: none; border-color: var(--green); }
  #chatSend { width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #0a0a0a; border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s var(--ios-ease); }
  #chatSend:active { transform: scale(0.9); }

  /* ==== TRANSLATOR ==== */
  #translator { display: flex; flex-direction: column; height: 100%; gap: 10px; }
  #translator select { padding: 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #eee; font-family: inherit; font-size: 0.9rem; }
  #translator textarea { flex: 1; min-height: 120px; padding: 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #eee; font-family: inherit; font-size: 0.95rem; resize: vertical; }
  #translator .trans-out { padding: 14px; background: rgba(151,206,76,0.1); border: 1px solid var(--green); border-radius: 10px; min-height: 80px; color: #eee; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
  #translator .trans-btn { padding: 14px; background: var(--green); color: #0a0a0a; border: none; border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
  #translator .trans-btn:active { transform: scale(0.97); }

  /* ==== EDITOR ==== */
  #editor { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  #editor.show { display: flex; animation: ios-scale 0.35s var(--ios-ease); }
  #topbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: rgba(20,20,20,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid #2a2a2a; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  #topbar::-webkit-scrollbar { display: none; }
  #topbar .title { flex: 1; font-size: 0.8rem; color: var(--green); letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 80px; }
  .icon-btn { background: #1f1f1f; border: 1px solid #333; color: var(--green); min-width: 36px; height: 36px; padding: 0 8px; border-radius: 10px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s var(--ios-ease); }
  .icon-btn:active { background: var(--green); color: #0a0a0a; transform: scale(0.9); }
  #toolbar { display: none; gap: 6px; padding: 8px 10px; background: rgba(26,26,26,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #2a2a2a; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; align-items: center; }
  #toolbar::-webkit-scrollbar { display: none; }
  #toolbar.show { display: flex; }
  .tool { background: #222; border: 1px solid #333; color: #eee; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; transition: all 0.15s var(--ios-ease); }
  .tool:active { background: var(--green); color: #0a0a0a; transform: scale(0.9); }
  .tool.active { background: var(--green); color: #0a0a0a; }
  .tool.color-btn { position: relative; }
  .tool.color-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .divider { width: 1px; height: 24px; background: #333; flex-shrink: 0; margin: 0 2px; }
  #slideArea { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; background: #050505; }
  #canvas { width: 100%; height: 100%; background: #fff; color: #111; border-radius: 12px; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); touch-action: none; transition: border-radius 0.3s var(--ios-ease); }
  #canvas.present { border-radius: 0; }

  @keyframes slideInRight { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideInLeft { from { transform: translateX(-60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #canvas.anim-right { animation: slideInRight 0.45s var(--ios-ease); }
  #canvas.anim-left { animation: slideInLeft 0.45s var(--ios-ease); }
  #canvas.anim-fade { animation: fadeIn 0.45s var(--ios-ease); }
  #canvas.anim-zoom { animation: zoomIn 0.45s var(--ios-ease); }

  .text-block { position: absolute; min-width: 40px; min-height: 30px; padding: 6px 8px; outline: none; cursor: move; white-space: pre-wrap; word-wrap: break-word; line-height: 1.3; border: 1px dashed transparent; }
  .text-block:focus { border-color: #4a90e2; cursor: text; }
  .text-block.selected { border: 1px dashed var(--green); }
  .text-block.present { cursor: default; border-color: transparent !important; }
  .img-block { position: absolute; border: 1px dashed transparent; cursor: move; user-select: none; touch-action: none; }
  .img-block img { display: block; width: 100%; height: 100%; pointer-events: none; object-fit: cover; }
  .img-block.selected { border-color: var(--green); }
  .img-block.present { border-color: transparent !important; cursor: default; }
  .handle { position: absolute; width: 20px; height: 20px; background: var(--green); border: 2px solid #0a0a0a; border-radius: 50%; z-index: 10; }
  .handle.tl { top: -10px; left: -10px; cursor: nwse-resize; }
  .handle.tr { top: -10px; right: -10px; cursor: nesw-resize; }
  .handle.bl { bottom: -10px; left: -10px; cursor: nesw-resize; }
  .handle.br { bottom: -10px; right: -10px; cursor: nwse-resize; }
  .handle.rot { bottom: -40px; left: 50%; transform: translateX(-50%); background: #f0c040; cursor: grab; }
  .present .handle { display: none; }
  #props { display: none; flex-direction: column; gap: 8px; padding: 10px 12px; background: #0f0f0f; border-top: 1px solid #2a2a2a; max-height: 40vh; overflow-y: auto; flex-shrink: 0; }
  #props.show { display: flex; }
  #props .row { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #props .row::-webkit-scrollbar { display: none; }
  #props .lbl { font-size: 0.7rem; color: var(--green); letter-spacing: 1px; min-width: 70px; text-transform: uppercase; flex-shrink: 0; }
  #props input[type="range"] { flex: 1; min-width: 100px; accent-color: var(--green); height: 4px; }
  #props input[type="color"] { width: 40px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 6px; }
  #props .mini { background: #222; border: 1px solid #333; color: #eee; padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: all 0.15s var(--ios-ease); }
  #props .mini:active { background: var(--green); color: #0a0a0a; transform: scale(0.9); }
  #props .mini.active { background: var(--green); color: #0a0a0a; }
  #props .val { font-size: 0.75rem; color: #888; min-width: 40px; text-align: right; }
  #bottombar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; background: rgba(20,20,20,0.9); backdrop-filter: blur(15px); border-top: 1px solid #2a2a2a; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  #bottombar::-webkit-scrollbar { display: none; }
  #bottombar button { background: #1f1f1f; border: 1px solid #333; color: var(--green); padding: 9px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: all 0.15s var(--ios-ease); }
  #bottombar button:active { background: var(--green); color: #0a0a0a; transform: scale(0.95); }
  #bottombar button:disabled { opacity: 0.3; }
  #counter { font-size: 0.8rem; color: #888; letter-spacing: 1px; min-width: 50px; text-align: center; }
  #thumbs { display: none; gap: 8px; overflow-x: auto; padding: 8px 10px; background: #0f0f0f; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
  #thumbs.show { display: flex; }
  .thumb { min-width: 70px; height: 44px; background: #fff; color: #111; border-radius: 8px; padding: 4px; font-size: 0.5rem; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.15s var(--ios-ease); }
  .thumb.active { border-color: var(--green); }
  .thumb .dup { position: absolute; top: 2px; right: 2px; background: var(--green); color: #0a0a0a; border: none; border-radius: 4px; font-size: 0.6rem; padding: 2px 4px; cursor: pointer; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; animation: ios-fade 0.25s var(--ios-ease); }
  #modal.show { display: flex; }
  #modal .box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; animation: ios-pop 0.35s var(--ios-ease); }
  #modal h3 { color: var(--green); font-size: 1rem; letter-spacing: 1px; }
  #modal p { color: #aaa; font-size: 0.85rem; line-height: 1.4; }
  #modal .row { display: flex; gap: 10px; }
  #modal button { flex: 1; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 0.9rem; cursor: pointer; border: 1px solid #333; background: #222; color: #eee; transition: all 0.15s var(--ios-ease); }
  #modal button:active { transform: scale(0.96); }
  #modal button.primary { background: var(--green); color: #0a0a0a; border-color: var(--green); font-weight: bold; }
  #modal input[type="text"], #modal textarea { padding: 12px; border-radius: 10px; border: 1px solid #333; background: #111; color: #eee; font-family: inherit; font-size: 1rem; width: 100%; }
  #modal textarea { min-height: 100px; resize: vertical; }
  #modal .tpl-list { display: flex; flex-direction: column; gap: 8px; }

function initials(name){

  const parts = name.trim().split(/\s+/);

  return name.slice(0,2).toUpperCase();
}

function compressImage(file, maxSize, quality){
  quality = quality || 0.75;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
        else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const err = document.getElementById('authError');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Заполни email и пароль'; return; }
  if (password.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
  try {
    if (authMode === 'register') {
      if (!name || name.indexOf(' ') === -1) { err.textContent = 'Введи Имя и Фамилию'; return; }

      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { name, email, avatar: null, createdAt: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch(e) {
    err.textContent = translateErr(e.code || e.message);
  }
};

    'auth/invalid-credential': 'Неверный email или пароль',
    'auth/network-request-failed': 'Проблема с сетью'

  return map[code] || ('Ошибка: ' + code);
}

function renderMine(){
  const ids = Object.keys(presentations).sort((a,b) => (presentations[b].updatedAt||0) - (presentations[a].updatedAt||0));
  if (!ids.length) {

      </div>`;
    fab.classList.remove('hide');
    fab.onclick = createNewPres;
    return;
  }
  ids.forEach((id, idx) => {
    const pr = presentations[id];
    const card = document.createElement('div');
    card.className = 'pres-card';
    card.style.animationDelay = (idx * 40) + 'ms';
    const thumbHtml = pr.cover ? `<div class="p-thumb"><img src="${pr.cover}" alt=""></div>` : `<div class="p-thumb">📊</div>`;
    card.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;">
        ${thumbHtml}
        <div style="flex:1;min-width:0;">
          <div class="p-title">${esc(pr.title)}</div>

        </div>
      </div>
      <div class="p-actions">
        <button data-act="dup">⧉</button>
        <button data-act="del">🗑</button>
      </div>`;
    card.onclick = e => {
      if (e.target.dataset.act === 'dup') { duplicatePres(id); return; }
      if (e.target.dataset.act === 'del') { deletePres(id); return; }
      openPres(id);
    };
    content.appendChild(card);
  });
  fab.classList.remove('hide');
  fab.onclick = createNewPres;
}

function createNewPres(){
  showToast(randomQuote());
  setTimeout(() => {
    openPrompt('Новая презентация', 'Название:', 'Презентация ' + (Object.keys(presentations).length+1), async v => {
      const id = uid();
      const pr = { id, title: v, slides: [newSlide()], animation: 'fade', cover: null, updatedAt: Date.now() };
      presentations[id] = pr;
      await savePresentation(pr);
      renderMine();
      openPres(id);
    });
  }, 400);
}

function duplicatePres(id){
  const src = presentations[id]; if (!src) return;
  const nid = uid();
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = nid; copy.title = src.title + ' (копия)'; copy.updatedAt = Date.now();
  copy.slides.forEach(s => s.elements.forEach(e => e.id = uidEl()));
  presentations[nid] = copy;
  savePresentation(copy).then(() => renderMine());
  showToast('Скопировано');
}

function deletePres(id){
  const pr = presentations[id]; if (!pr) return;
  openConfirm('Удалить?', `«${pr.title}»`, async () => {
    delete presentations[id];
    try { await deleteDoc(doc(db, 'users', currentUser.uid, 'presentations', id)); } catch(e){}
    renderMine(); showToast('Удалено');
  });
}

        authorName: data.authorName || 'Аноним',
        authorAvatar: data.authorAvatar || null,
        imageBase64: data.imageBase64 || null,
        createdAt: data.createdAt ? (data.createdAt.toMillis ? data.createdAt.toMillis() : 0) : 0
      });
    });
    news.sort((a,b) => b.createdAt - a.createdAt);

    content.innerHTML = '<div class="empty">Не удалось загрузить новости.<br>' + esc(e.message) + '</div>';

  if (isAdmin) {
    const btn = document.createElement('button');
    btn.style.cssText = 'width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:0.95rem;font-weight:bold;cursor:pointer;letter-spacing:1px;margin-bottom:12px;';
    btn.textContent = '+ ДОБАВИТЬ НОВОСТЬ';
    btn.onclick = addNews;
    content.appendChild(btn);
  }
  if (!news.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = `<img class="morty-empty" src="https://upload.wikimedia.org/wikipedia/en/6/6e/Morty_Smith.png" onerror="this.style.display='none'">Новостей пока нет.`;
    content.appendChild(e);
    return;
  }
  news.forEach((n, idx) => {
    const card = document.createElement('div');
    card.className = 'news-card';
    card.style.animationDelay = (idx * 40) + 'ms';
    const imgHtml = n.imageBase64 ? `<img class="news-img" src="${n.imageBase64}" alt="">` : '';
    card.innerHTML = `<h3>${esc(n.title)}</h3><div class="meta">${esc(n.authorName)} · ${fmtDate(n.createdAt)}</div>${imgHtml}<div class="body">${esc(n.body)}</div>`;
    if (isAdmin) {
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = 'Удалить';
      del.onclick = async () => {
        openConfirm('Удалить новость?', '', async () => {
          try { await deleteDoc(doc(db, 'news', n.id)); } catch(e){}
          renderNews();
        });
      };
      card.appendChild(del);
    }
    content.appendChild(card);
  });
}

function addNews(){
  modalTitle.textContent = 'Новая новость';
  modalText.textContent = 'Что опубликовать?';
  modalContent.innerHTML = '';
  newsImageBase64 = null;

  const inpT = document.createElement('input');
  inpT.type = 'text'; inpT.placeholder = 'Заголовок';

  const inpB = document.createElement('textarea');
  inpB.placeholder = 'Текст новости';

  const imgLabel = document.createElement('button');
  imgLabel.type = 'button';
  imgLabel.style.cssText = 'width:100%;padding:12px;background:#222;border:1px dashed #555;color:var(--green);border-radius:10px;font-family:inherit;font-size:0.85rem;cursor:pointer;margin-top:6px;';
  imgLabel.textContent = '📷 Добавить фото (необязательно)';

  const preview = document.createElement('img');
  preview.style.cssText = 'display:none;width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px;';

  const imgInput = document.createElement('input');
  imgInput.type = 'file'; imgInput.accept = 'image/*';
  imgInput.style.display = 'none';

  imgLabel.onclick = () => imgInput.click();
  imgInput.onchange = async () => {
    const f = imgInput.files[0]; if (!f) return;
    imgLabel.textContent = '⏳ Обрабатываю...';
    try {
      const b64 = await compressImage(f, 800);
      newsImageBase64 = b64;
      preview.src = b64;
      preview.style.display = 'block';
      imgLabel.textContent = '✓ Фото добавлено';
    } catch(e) {
      showToast('Не удалось загрузить фото');
      imgLabel.textContent = '📷 Добавить фото (необязательно)';
    }
  };

  modalContent.appendChild(inpT);
  modalContent.appendChild(inpB);
  modalContent.appendChild(imgLabel);
  modalContent.appendChild(preview);
  modalContent.appendChild(imgInput);

  modalOk.style.display = ''; modalOk.className = 'primary';
  modalOk.textContent = 'Опубликовать';
  modalCancel.textContent = 'Отмена';
  modal.classList.add('show');
  setTimeout(() => inpT.focus(), 50);

  modalOk.onclick = async () => {
    const t = inpT.value.trim(), b = inpB.value.trim();
    if (!t || !b) { showToast('Заполни оба поля'); return; }
    modalOk.disabled = true;
    modalOk.textContent = 'Публикую...';
    try {
      const newsDoc = {
        title: t, body: b,
        authorUid: currentUser.uid,
        authorName: userName,
        authorAvatar: userAvatar || null,
        createdAt: serverTimestamp()
      };
      if (newsImageBase64) newsDoc.imageBase64 = newsImageBase64;
      await addDoc(collection(db, 'news'), newsDoc);
      newsImageBase64 = null;
      closeModal();
      showToast('Опубликовано');
      renderNews();
    } catch(e) {
      showToast('Ошибка: ' + e.message);
      modalOk.disabled = false;
      modalOk.textContent = 'Опубликовать';
    }
  };
  modalCancel.onclick = () => { newsImageBase64 = null; closeModal(); };
}

async function requestImport(p, owner){
  closeModal();
  try {
    // Проверим, что запрос ещё не отправлен
    const existing = await getDocs(query(collection(db, 'importRequests'), where('fromUid','==',currentUser.uid), where('presId','==',p.id)));
    let already = false;
    existing.forEach(d => { if (d.data().status === 'pending' || d.data().status === 'approved') already = true; });
    if (already) { showToast('Запрос уже отправлен'); return; }

    await addDoc(collection(db, 'importRequests'), {
      fromUid: currentUser.uid,
      fromName: userName,
      fromAvatar: userAvatar || null,
      toUid: owner.uid,
      toName: owner.name,
      presId: p.id,
      presTitle: p.title,
      presData: p,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    showToast('Запрос отправлен владельцу');
  } catch(e) {
    showToast('Ошибка: ' + e.message);
  }
}

function setupRequestsListener(){
  if (reqUnsub) reqUnsub();
  const q = query(collection(db, 'importRequests'), where('toUid','==',currentUser.uid));
  reqUnsub = onSnapshot(q, snap => {
    let count = 0;
    snap.forEach(d => { if (d.data().status === 'pending') count++; });
    pendingRequestsCount = count;
    const badge = document.getElementById('reqBadge');
    if (count > 0) { badge.style.display = 'inline-block'; badge.textContent = count; }
    else badge.style.display = 'none';
    // Обновим если открыта вкладка requests
    const reqTab = document.querySelector('#tabs button[data-tab="requests"]');
    if (reqTab && reqTab.classList.contains('active')) renderRequests();
  });
}

async function renderRequests(){
  content.innerHTML = '<div class="empty">Загружаю заявки…</div>';
  let incoming = [], outgoing = [];
  try {
    const q1 = query(collection(db, 'importRequests'), where('toUid','==',currentUser.uid));
    const snap1 = await getDocs(q1);
    snap1.forEach(d => incoming.push({ id: d.id, ...d.data() }));

    const q2 = query(collection(db, 'importRequests'), where('fromUid','==',currentUser.uid));
    const snap2 = await getDocs(q2);
    snap2.forEach(d => outgoing.push({ id: d.id, ...d.data() }));

    incoming.sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    outgoing.sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  } catch(e) {
    content.innerHTML = '<div class="empty">Ошибка: ' + esc(e.message) + '</div>';
    return;
  }
  content.innerHTML = '';

  const h1 = document.createElement('div');
  h1.style.cssText = 'color:var(--green);font-size:0.8rem;letter-spacing:2px;margin:10px 4px 8px;';
  h1.textContent = '📥 ВХОДЯЩИЕ (к тебе)';
  content.appendChild(h1);

  if (!incoming.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.style.padding = '20px';
    e.textContent = 'Никто не просит твои презентации.';
    content.appendChild(e);
  } else {
    incoming.forEach(r => {
      const c = document.createElement('div');
      c.className = 'req-card';
      const statusTxt = r.status === 'pending' ? '⏳ Ждёт ответа' : r.status === 'approved' ? '✅ Одобрено' : '❌ Отклонено';
      c.innerHTML = `<div class="req-title"><b>${esc(r.fromName)}</b> просит «${esc(r.presTitle)}»</div><div style="font-size:0.72rem;color:#888;">Статус: ${statusTxt} · ${fmtDate(r.createdAt?.toMillis?.() || 0)}</div>`;
      if (r.status === 'pending') {
        const btns = document.createElement('div'); btns.className = 'req-btns';
        const acc = document.createElement('button'); acc.className = 'accept'; acc.textContent = '✓ Одобрить';
        const dec = document.createElement('button'); dec.className = 'decline'; dec.textContent = '✕ Отклонить';
        acc.onclick = () => approveRequest(r);
        dec.onclick = () => declineRequest(r);
        btns.appendChild(acc); btns.appendChild(dec);
        c.appendChild(btns);
      }
      content.appendChild(c);
    });
  }

  const h2 = document.createElement('div');
  h2.style.cssText = 'color:var(--green);font-size:0.8rem;letter-spacing:2px;margin:20px 4px 8px;';
  h2.textContent = '📤 ИСХОДЯЩИЕ (от тебя)';
  content.appendChild(h2);

  if (!outgoing.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.style.padding = '20px';
    e.textContent = 'Ты никого не просил.';
    content.appendChild(e);
  } else {
    outgoing.forEach(r => {
      const c = document.createElement('div');
      c.className = 'req-card';
      const statusTxt = r.status === 'pending' ? '⏳ Ждёт ответа' : r.status === 'approved' ? '✅ Одобрено' : '❌ Отклонено';
      c.innerHTML = `<div class="req-title">Ты просишь «${esc(r.presTitle)}» у <b>${esc(r.toName)}</b></div><div style="font-size:0.72rem;color:#888;">Статус: ${statusTxt} · ${fmtDate(r.createdAt?.toMillis?.() || 0)}</div>`;
      content.appendChild(c);
    });
  }
}

async function approveRequest(r){
  try {
    // Копируем презентацию к отправителю запроса
    const nid = uid();
    const copy = JSON.parse(JSON.stringify(r.presData));
    copy.id = nid;
    copy.title = r.presTitle + ' (от ' + userName + ')';
    copy.updatedAt = new Date().toISOString();
    copy.slides.forEach(s => (s.elements || []).forEach(e => e.id = uidEl()));

    await setDoc(doc(db, 'users', r.fromUid, 'presentations', nid), {
      title: copy.title,
      slides: copy.slides,
      animation: copy.animation || 'fade',
      updatedAt: serverTimestamp()
    });
    // Помечаем запрос
    await setDoc(doc(db, 'importRequests', r.id), { status: 'approved' }, { merge: true });
    showToast('Одобрено, отправлено');
    renderRequests();
  } catch(e) {
    showToast('Ошибка: ' + e.message);
  }
}

async function declineRequest(r){
  try {
    await setDoc(doc(db, 'importRequests', r.id), { status: 'declined' }, { merge: true });
    showToast('Отклонено');
    renderRequests();
  } catch(e) { showToast('Ошибка: ' + e.message); }
}

// ==== EDITOR ====
function openPres(id){
  currentPresId = id;
  menu.classList.remove('show');
  editor.classList.add('show');
  fab.classList.remove('hide');
  renderEditor();
}
function backToMenu(){
  if (cur()) savePresentation(cur());
  currentPresId = null;
  editor.classList.remove('show');
  menu.classList.add('show');
  fab.classList.add('hide');
  renderTab('mine');
}

function renderEditor(){
  const pr = cur(); if (!pr) { backToMenu(); return; }
  docTitle.textContent = pr.title;
  if (typeof pr.current !== 'number' || pr.current < 0 || pr.current >= pr.slides.length) pr.current = 0;
  counter.textContent = (pr.current+1) + ' / ' + pr.slides.length;
  document.getElementById('prevBtn').disabled = pr.current === 0;
  document.getElementById('nextBtn').disabled = pr.current === pr.slides.length - 1;
  renderCanvas(); renderThumbs();
}

function switchSlide(newIndex, direction){
  const pr = cur(); if (!pr) return;
  if (newIndex < 0 || newIndex >= pr.slides.length) return;
  if (newIndex === pr.current) return;
  const dir = direction || (newIndex > pr.current ? 'right' : 'left');
  pr.current = newIndex;
  renderEditor();
  const anim = pr.animation || 'fade';
  if (anim === 'none') return;
  const cls = 'anim-' + (anim === 'slide' ? dir : anim);
  canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom');
  void canvas.offsetWidth;
  canvas.classList.add(cls);
  setTimeout(() => canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom'), 500);
}

function renderCanvas(){
  canvas.innerHTML = '';
  const pr = cur();
  const slide = pr.slides[pr.current];
  canvas.style.background = slide.bg || '#ffffff';
  slide.elements.forEach(el => canvas.appendChild(createElNode(el)));
  selectedEl = null;
  toolbar.classList.remove('show'); props.classList.remove('show');
}

function renderThumbs(){
  const pr = cur();
  thumbsEl.innerHTML = '';
  pr.slides.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (i === pr.current ? ' active' : '');
    const t = s.elements.find(e => e.type === 'text');
    d.textContent = t ? t.text.slice(0, 25) : (s.elements.length ? '🖼' : '—');
    d.style.background = s.bg || '#fff';
    d.onclick = e => { if (e.target.classList.contains('dup')) return; switchSlide(i); scheduleSave(); };
    const dupB = document.createElement('button');
    dupB.className = 'dup'; dupB.textContent = '⧉';
    dupB.onclick = e => { e.stopPropagation(); duplicateSlide(i); };
    d.appendChild(dupB);
    thumbsEl.appendChild(d);
  });
}

function duplicateSlide(i){
  const pr = cur();
  const c = JSON.parse(JSON.stringify(pr.slides[i]));
  c.elements.forEach(el => el.id = uidEl());
  pr.slides.splice(i+1, 0, c);
  if (pr.current >= i+1) pr.current++;
  renderEditor(); scheduleSave(); showToast('Дублировано');
}

function createElNode(el){
  const node = document.createElement('div');
  node.className = el.type === 'text' ? 'text-block' : 'img-block';
  node.dataset.id = el.id;
  applyStyles(node, el);
  if (el.type === 'text') {
    node.contentEditable = document.body.classList.contains('present') ? 'false' : 'true';
    node.innerHTML = el.html || '';
  } else {
    const img = document.createElement('img');
    img.src = el.src; img.draggable = false;
    node.appendChild(img);
  }
  makeDraggable(node, el);
  return node;
}

function applyStyles(node, el){
  node.style.left = el.x + 'px';
  node.style.top = el.y + 'px';
  node.style.width = el.w + 'px';
  node.style.height = el.h + 'px';
  let tr = [];
  if (el.rot) tr.push(`rotate(${el.rot}deg)`);
  if (el.flipX) tr.push('scaleX(-1)');
  if (el.flipY) tr.push('scaleY(-1)');
  node.style.transform = tr.join(' ');
  node.style.opacity = el.opacity != null ? el.opacity : 1;
  if (el.type === 'text') {
    node.style.fontFamily = el.fontFamily || 'inherit';
    node.style.fontSize = (el.fontSize || 20) + 'px';
    node.style.color = el.color || '#111';
    node.style.background = el.bg || 'transparent';
    node.style.textAlign = el.align || 'left';
    node.style.fontWeight = el.bold ? 'bold' : 'normal';
    node.style.fontStyle = el.italic ? 'italic' : 'normal';
    node.style.textDecoration = el.underline ? 'underline' : (el.strike ? 'line-through' : 'none');
    node.style.lineHeight = el.lineHeight || 1.3;
    node.style.letterSpacing = (el.letterSpacing || 0) + 'px';
    node.style.borderRadius = (el.radius || 0) + 'px';
    node.style.padding = (el.padding != null ? el.padding : 6) + 'px ' + (el.paddingX != null ? el.paddingX : 8) + 'px';
    if (el.shadow) node.style.textShadow = `${el.shadowX||2}px ${el.shadowY||2}px ${el.shadowBlur||4}px ${el.shadowColor||'#000000'}`;
    else node.style.textShadow = 'none';
    if (el.stroke) node.style.webkitTextStroke = `${el.strokeWidth||1}px ${el.strokeColor||'#000000'}`;
    else node.style.webkitTextStroke = '';
  } else {
    node.style.borderRadius = (el.radius || 0) + 'px';
    if (el.shadow) node.style.boxShadow = `${el.shadowX||4}px ${el.shadowY||4}px ${el.shadowBlur||10}px ${el.shadowColor||'#00000066'}`;
    else node.style.boxShadow = 'none';
    if (el.border) node.style.border = `${el.borderWidth||2}px solid ${el.borderColor||'#000000'}`;
    else node.style.border = '1px dashed transparent';
    node.style.overflow = 'hidden';
  }
}

function makeDraggable(node, el){
  let sx, sy, sl, st, sw, sh, mode = null, pd = 0, pw = 0, ph = 0;
  function gp(e){ if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY }; return { x: e.clientX, y: e.clientY }; }
  function gd(t1,t2){ const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY; return Math.sqrt(dx*dx+dy*dy); }
  function onStart(e){
    if (document.body.classList.contains('present')) return;
    selectEl(node, el);
    if (e.touches && e.touches.length === 2) {
      mode = 'pinch';
      pd = gd(e.touches[0], e.touches[1]);
      pw = parseFloat(node.style.width) || node.offsetWidth;
      ph = parseFloat(node.style.height) || node.offsetHeight;
      e.preventDefault(); return;
    }
    mode = e.target.classList.contains('handle') ? (e.target.dataset.mode || 'move') : 'move';
    const p = gp(e);
    sx = p.x; sy = p.y;
    sl = parseFloat(node.style.left) || 0;
    st = parseFloat(node.style.top) || 0;
    sw = parseFloat(node.style.width) || node.offsetWidth;
    sh = parseFloat(node.style.height) || node.offsetHeight;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    e.preventDefault(); e.stopPropagation();
  }
  function onMove(e){
    if (!mode) return;
    if (mode === 'pinch') {
      if (!e.touches || e.touches.length < 2) return;
      const r = gd(e.touches[0], e.touches[1]) / pd;
      const nw = Math.max(30, pw * r), nh = Math.max(20, ph * r);
      node.style.width = nw + 'px'; node.style.height = nh + 'px';
      el.w = nw; el.h = nh;
      e.preventDefault(); scheduleSave(); return;
    }
    const p = gp(e);
    const dx = p.x - sx, dy = p.y - sy;
    const scale = canvas.getBoundingClientRect().width / canvas.offsetWidth || 1;
    if (mode === 'move') {
      let nx = sl + dx/scale, ny = st + dy/scale;
      node.style.left = nx + 'px'; node.style.top = ny + 'px';
      el.x = nx; el.y = ny;
    } else if (mode === 'resize-br') {
      let nw = Math.max(30, sw + dx/scale), nh = Math.max(20, sh + dy/scale);
      if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
      node.style.width = nw + 'px'; node.style.height = nh + 'px';
      el.w = nw; el.h = nh;
    } else if (mode === 'resize-tl') {
      let nw = Math.max(30, sw - dx/scale), nh = Math.max(20, sh - dy/scale);
      if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
      let nx = sl + (sw - nw), ny = st + (sh - nh);
      node.style.width = nw + 'px'; node.style.height = nh + 'px';
      node.style.left = nx + 'px'; node.style.top = ny + 'px';
      el.w = nw; el.h = nh; el.x = nx; el.y = ny;
    } else if (mode === 'resize-tr') {
      let nw = Math.max(30, sw + dx/scale), nh = Math.max(20, sh - dy/scale);
      if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
      let ny = st + (sh - nh);
      node.style.width = nw + 'px'; node.style.height = nh + 'px'; node.style.top = ny + 'px';
      el.w = nw; el.h = nh; el.y = ny;
    } else if (mode === 'resize-bl') {
      let nw = Math.max(30, sw - dx/scale), nh = Math.max(20, sh + dy/scale);
      if (el.aspectLock && el.type === 'image') { const r = sw/sh; if (Math.abs(dx)>Math.abs(dy)) nh = nw/r; else nw = nh*r; }
      let nx = sl + (sw - nw);
      node.style.width = nw + 'px'; node.style.height = nh + 'px'; node.style.left = nx + 'px';
      el.w = nw; el.h = nh; el.x = nx;
    } else if (mode === 'rotate') {
      const rect = node.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      let ang = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90;
      el.rot = ang;
      let tr = [`rotate(${ang}deg)`];
      if (el.flipX) tr.push('scaleX(-1)');
      if (el.flipY) tr.push('scaleY(-1)');
      node.style.transform = tr.join(' ');
    }
    scheduleSave(); e.preventDefault();
  }
  function onEnd(){
    if (mode === 'pinch') { mode = null; return; }
    if (!mode) return;
    mode = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    if (cur()) savePresentation(cur());
  }
  node.addEventListener('mousedown', onStart);
  node.addEventListener('touchstart', onStart, { passive: false });
}

function selectEl(node, el){
  if (document.body.classList.contains('present')) return;
  document.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  document.querySelectorAll('.handle').forEach(h => h.remove());
  selectedEl = { node, el };
  node.classList.add('selected');
  if (el.type === 'image') {
    ['tl','tr','bl','br'].forEach(pos => {
      const h = document.createElement('div');
      h.className = 'handle ' + pos; h.dataset.mode = 'resize-' + pos;
      node.appendChild(h);
    });
    const r = document.createElement('div');
    r.className = 'handle rot'; r.dataset.mode = 'rotate';
    node.appendChild(r);
  }
  if (el.type === 'text') toolbar.classList.add('show'); else toolbar.classList.remove('show');
  renderProps();
}
function clearSelection(){
  document.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  document.querySelectorAll('.handle').forEach(h => h.remove());
  selectedEl = null;
  toolbar.classList.remove('show'); props.classList.remove('show');
}

function mkRange(min, max, value, onInput){
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;align-items:center;gap:6px;flex:1;min-width:120px;';

  r.type = 'range'; r.min = min; r.max = max; r.value = value;
  const v = document.createElement('span'); v.className = 'val'; v.textContent = value;
  r.oninput = () => { v.textContent = r.value; onInput(parseFloat(r.value)); };
  w.appendChild(r); w.appendChild(v);
  return w;
}
function scaleEl(f){
  if (!selectedEl) return;
  const el = selectedEl.el;
  const nw = Math.max(20, (el.w||100)*f), nh = Math.max(20, (el.h||100)*f);

  selectedEl.node.style.width = nw + 'px'; selectedEl.node.style.height = nh + 'px';
  scheduleSave();
}
function duplicateSelected(){

  el.id = uidEl(); el.x = (el.x||0)+20; el.y = (el.y||0)+20;
  cur().slides[cur().current].elements.push(el);
  const node = createElNode(el); canvas.appendChild(node);
  setTimeout(() => selectEl(node, el), 50);

}
function deleteSelected(){

    const b = document.createElement('button');
    b.className = 'tpl-item';
    b.innerHTML = `<span class="ico">${t.ico}</span><span>${t.name}</span>`;
    b.onclick = () => {
      closeModal();
      const pr = cur();
      const sl = t.build();
      pr.slides.splice(pr.current + 1, 0, ...sl);
      switchSlide(pr.current + sl.length);
      scheduleSave(); showToast('Слайд добавлен');
    };
    list.appendChild(b);
  });
  modalContent.appendChild(list);
  modalOk.style.display = 'none';
  modalCancel.textContent = 'Закрыть';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
}

function txt(text, x, y, w, h, opts){
  return Object.assign({
    id: uidEl(), type: 'text', x, y, w, h,
    html: text, text: text,
    fontSize: 22, color: '#111111', bg: 'transparent',
    fontFamily: 'inherit', align: 'left', bold: false, italic: false,
    underline: false, strike: false, lineHeight: 1.3, letterSpacing: 0,
    radius: 0, padding: 6, paddingX: 8, opacity: 1, rot: 0,
    shadow: false, stroke: false
  }, opts || {});
}

function downloadPng(dataUrl, name){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

async function renderSlideToPng(slideIndex){
  const pr = cur(); if (!pr) throw new Error('Нет презентации');
  const slide = pr.slides[slideIndex];
  const w = canvas.offsetWidth || 640;
  const h = canvas.offsetHeight || 360;
  const clone = document.createElement('div');
  clone.style.cssText = `position:fixed;left:-99999px;top:0;width:${w}px;height:${h}px;background:${slide.bg || '#ffffff'};overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;`;
  slide.elements.forEach(el => {
    const node = createElNode(el);
    node.contentEditable = 'false'; node.style.cursor = 'default';
    node.classList.remove('selected'); node.style.borderColor = 'transparent';
    const hs = node.querySelectorAll && node.querySelectorAll('.handle');
    if (hs) hs.forEach(hh => hh.remove());
    clone.appendChild(node);
  });
  document.body.appendChild(clone);
  try {
    const c = await html2canvas(clone, { backgroundColor: slide.bg || '#ffffff', scale: 2, useCORS: true, allowTaint: true, logging: false });
    return c.toDataURL('image/png');
  } finally { document.body.removeChild(clone); }
}

function openExportDialog(){
  const pr = cur(); if (!pr) return;
  modalTitle.textContent = 'Экспорт слайдов';
  modalText.textContent = 'Сохранить как PNG:';
  modalContent.innerHTML = '';
  const list = document.createElement('div'); list.className = 'tpl-list';
  const b1 = document.createElement('button');
  b1.className = 'tpl-item';
  b1.innerHTML = `<span class="ico">📄</span><span>Текущий слайд (${pr.current+1})</span>`;
  b1.onclick = async () => {
    closeModal(); showToast('Готовлю картинку...');
    try {
      const dataUrl = await renderSlideToPng(pr.current);
      downloadPng(dataUrl, 'slide-' + (pr.current+1) + '.png');
      showToast('Сохранено!');
    } catch(e) { showToast('Ошибка: ' + e.message); }
  };
  list.appendChild(b1);
  const b2 = document.createElement('button');
  b2.className = 'tpl-item';
  b2.innerHTML = `<span class="ico">📚</span><span>Все слайды (${pr.slides.length} PNG)</span>`;
  b2.onclick = async () => {
    closeModal();
    showToast('Готовлю ' + pr.slides.length + ' картинок...');
    let ok = 0, fail = 0;
    for (let i = 0; i < pr.slides.length; i++) {
      try { const dataUrl = await renderSlideToPng(i); downloadPng(dataUrl, 'slide-' + (i+1) + '.png'); ok++; }
      catch(e) { fail++; }
      await new Promise(r => setTimeout(r, 500));
    }
    showToast('Готово: ' + ok + ' ok' + (fail ? ', ' + fail + ' fail' : ''));
  };
  list.appendChild(b2);
  modalContent.appendChild(list);
  modalOk.style.display = 'none';
  modalCancel.textContent = 'Закрыть';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
}

function openAnimDialog(){
  const pr = cur(); if (!pr) return;
  const curAnim = pr.animation || 'fade';
  modalTitle.textContent = 'Анимация переходов';
  modalText.textContent = 'Как переключать слайды:';
  modalContent.innerHTML = '';
  const list = document.createElement('div'); list.className = 'tpl-list';
  const opts = [['none','🚫','Нет'],['fade','✨','Плавное появление'],['slide','➡','Сдвиг в сторону'],['zoom','🔍','Приближение']];
  opts.forEach(([val, ico, name]) => {
    const b = document.createElement('button');
    b.className = 'tpl-item';
    if (curAnim === val) { b.style.background = 'var(--green)'; b.style.color = '#0a0a0a'; }
    b.innerHTML = `<span class="ico">${ico}</span><span>${name}</span>`;
    b.onclick = () => {
      pr.animation = val; scheduleSave(); closeModal();
      showToast('Анимация: ' + name);
      if (val !== 'none') {
        canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom');
        void canvas.offsetWidth;
        canvas.classList.add('anim-' + (val === 'slide' ? 'right' : val));
        setTimeout(() => canvas.classList.remove('anim-right','anim-left','anim-fade','anim-zoom'), 500);
      }
    };
    list.appendChild(b);
  });
  modalContent.appendChild(list);
  modalOk.style.display = 'none';
  modalCancel.textContent = 'Закрыть';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
}

// ==== AVATAR / PROFILE ====
document.getElementById('myAvatarBtn').onclick = () => {
  showToast(randomQuote());
};

document.getElementById('changeNameBtn').onclick = () => {
  modalTitle.textContent = 'Профиль';
  modalText.textContent = 'Измени имя и аватар:';
  modalContent.innerHTML = '';
  const avWrap = document.createElement('div');
  avWrap.className = 'avatar-preview';
  if (userAvatar) avWrap.innerHTML = `<img src="${userAvatar}" alt="">`;
  else avWrap.textContent = initials(userName);

  const avBtn = document.createElement('button');
  avBtn.style.cssText = 'padding:10px;background:#222;border:1px dashed #555;color:var(--green);border-radius:10px;font-family:inherit;font-size:0.85rem;cursor:pointer;';
  avBtn.textContent = '📷 Изменить аватар';

  const avInput = document.createElement('input');
  avInput.type = 'file'; avInput.accept = 'image/*'; avInput.style.display = 'none';

  let newAvatar = userAvatar;

  avBtn.onclick = () => avInput.click();
  avInput.onchange = async () => {
    const f = avInput.files[0]; if (!f) return;
    avBtn.textContent = '⏳ Обрабатываю...';
    try {
      const b64 = await compressImage(f, 400, 0.8);
      newAvatar = b64;
      avWrap.innerHTML = `<img src="${b64}" alt="">`;
      avBtn.textContent = '✓ Аватар готов';
    } catch(e) { showToast('Ошибка фото'); avBtn.textContent = '📷 Изменить аватар'; }
  };

  const inpName = document.createElement('input');
  inpName.type = 'text'; inpName.value = userName; inpName.placeholder = 'Имя Фамилия';

  modalContent.appendChild(avWrap);
  modalContent.appendChild(avBtn);
  modalContent.appendChild(avInput);
  modalContent.appendChild(inpName);

  modalOk.style.display = ''; modalOk.className = 'primary';
  modalOk.textContent = 'Сохранить';
  modalCancel.textContent = 'Отмена';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
  setTimeout(() => inpName.focus(), 100);

  modalOk.onclick = async () => {
    const v = inpName.value.trim();
    if (!v) { showToast('Введи имя'); return; }
    try {
      await updateProfile(currentUser, { displayName: v });
      await setDoc(doc(db, 'users', currentUser.uid), { name: v, email: currentUser.email, avatar: newAvatar }, { merge: true });
      userName = v;
      userAvatar = newAvatar;
      updateUserUI();
      showToast('Профиль обновлён');
      closeModal();
    } catch(e) { showToast('Ошибка: ' + e.message); }
  };
};

// ==== PRESENTATION COVER ====
document.getElementById('coverBtn').onclick = () => {
  const pr = cur(); if (!pr) return;
  coverInput.value = '';
  coverInput.click();
};
coverInput.addEventListener('change', async () => {
  const f = coverInput.files[0]; if (!f) return;
  const pr = cur(); if (!pr) return;

    scheduleSave();

// ==== BUTTONS ====
document.getElementById('mortyBtn')?.addEventListener('click', () => showToast(randomQuote()));
setInterval(() => {
  const q = document.getElementById('authQuote');
  if (q && authScreen.style.display !== 'none') {
    q.style.opacity = '0';
    setTimeout(() => { q.textContent = randomQuote(); q.style.opacity = '1'; }, 400);
  }
}, 7000);

document.getElementById('backBtn').onclick = backToMenu;
document.getElementById('textBtn').onclick = () => addText();
document.getElementById('imgBtn').onclick = pickImage;
document.getElementById('fab').onclick = () => addText();
document.getElementById('dupBtn').onclick = duplicateSelected;
document.getElementById('animBtn').onclick = openAnimDialog;
document.getElementById('exportPngBtn').onclick = openExportDialog;
document.getElementById('renameBtn').onclick = () => {
  const pr = cur(); if (!pr) return;
  openPrompt('Название', '', pr.title, v => { pr.title = v; docTitle.textContent = v; scheduleSave(); });
};
document.getElementById('saveBtn').onclick = () => { if (cur()) savePresentation(cur()).then(() => showToast('Сохранено')); };
document.getElementById('addBtn').onclick = addSlideWithTemplate;
document.getElementById('dupSlideBtn').onclick = () => duplicateSlide(cur().current);
document.getElementById('delBtn').onclick = () => {
  const pr = cur();
  if (pr.slides.length <= 1) { pr.slides[0] = newSlide(); pr.current = 0; renderEditor(); scheduleSave(); return; }
  openConfirm('Удалить слайд?', '', () => {
    pr.slides.splice(pr.current, 1);
    if (pr.current >= pr.slides.length) pr.current = pr.slides.length - 1;
    renderEditor(); scheduleSave(); showToast('Удалён');
  });
};
document.getElementById('prevBtn').onclick = () => { const pr = cur(); if (pr.current > 0) switchSlide(pr.current - 1, 'left'); scheduleSave(); };
document.getElementById('nextBtn').onclick = () => { const pr = cur(); if (pr.current < pr.slides.length - 1) switchSlide(pr.current + 1, 'right'); scheduleSave(); };

// ==== PRESENT MODE ====
document.getElementById('presentBtn').onclick = () => {
  clearSelection();
  document.body.classList.add('present');
  canvas.classList.add('present');
  document.querySelectorAll('.text-block').forEach(n => n.contentEditable = 'false');
  if (canvas.requestFullscreen) canvas.requestFullscreen().catch(()=>{});
  else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
  showToast('Свайп или тап «✕» справа сверху');
};
document.getElementById('exitPresentBtn').onclick = exitPresent;
function exitPresent(){
  if (!document.body.classList.contains('present')) return;
  document.body.classList.remove('present');
  canvas.classList.remove('present');
  document.querySelectorAll('.text-block').forEach(n => n.contentEditable = 'true');
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  if (document.webkitFullscreenElement) document.webkitExitFullscreen();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) exitPresent(); });
document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement && document.body.classList.contains('present')) exitPresent(); });

let tX=0, tY=0, tT=0;
document.getElementById('slideArea').addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const t = e.changedTouches[0]; tX = t.clientX; tY = t.clientY; tT = Date.now();
}, { passive: true });
document.getElementById('slideArea').addEventListener('touchend', e => {
  if (!document.body.classList.contains('present')) return;
  const pr = cur(); if (!pr) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tX, dy = t.clientY - tY, dt = Date.now() - tT;
  if (dt < 700 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0 && pr.current < pr.slides.length - 1) { switchSlide(pr.current + 1, 'right'); scheduleSave(); }
    else if (dx > 0 && pr.current > 0) { switchSlide(pr.current - 1, 'left'); scheduleSave(); }
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!currentPresId) return;
  const inText = e.target.classList && e.target.classList.contains('text-block') && e.target.isContentEditable;
  if (inText) return;
  const pr = cur(); if (!pr) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (pr.current < pr.slides.length - 1) { switchSlide(pr.current + 1, 'right'); scheduleSave(); } }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (pr.current > 0) { switchSlide(pr.current - 1, 'left'); scheduleSave(); } }
  else if (e.key === 'Escape') exitPresent();
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedEl) deleteSelected();
  else if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateSelected(); }
});

function openPrompt(title, text, defaultValue, onOk){
  modalTitle.textContent = title;
  modalText.textContent = text || '';
  modalContent.innerHTML = '';
  const i = document.createElement('input'); i.type = 'text'; i.value = defaultValue || '';
  modalContent.appendChild(i);
  modalOk.style.display = ''; modalOk.className = 'primary';
  modalOk.textContent = 'OK'; modalCancel.textContent = 'Отмена';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
  setTimeout(() => { i.focus(); i.select(); }, 50);
  modalOk.onclick = () => { const v = i.value.trim(); if (v) { closeModal(); onOk(v); } };
  i.onkeydown = ev => { if (ev.key === 'Enter') modalOk.click(); };
}
function openConfirm(title, text, onOk){
  modalTitle.textContent = title;
  modalText.textContent = text || '';
  modalContent.innerHTML = '';
  modalOk.style.display = ''; modalOk.className = 'primary';
  modalOk.textContent = 'Да'; modalCancel.textContent = 'Отмена';
  modalCancel.onclick = closeModal;
  modal.classList.add('show');
  modalOk.onclick = () => { closeModal(); onOk && onOk(); };
}
function closeModal(){ modal.classList.remove('show'); }
